# Workspace-wide test serialization (v0.433, rationale updated 2026-09-23).
#
# The July wrong answers under parallel GPU tests (rotating victims, e.g.
# attn_v4 cos=0.9662, mat_mat cos as low as 0.48) match a mechanism reproduced
# on 2026-09-23: a GPU recovery ("firmware-detected lockup",
# DiagnosticReports/gpuEvent-qwen_llm-*.ips) discards other in-flight command
# buffers with kIOGPUCommandBufferCallbackErrorInnocentVictim, across processes.
# `waitUntilCompleted()` returns for discarded buffers, and unchecked call
# sites read the partial outputs as valid. Every wait now goes through
# `metal::wait_completed` (or an equivalent status check), so a recovery fails
# loudly with MetalError::CommandBufferFailed. With that and thread-local V_T
# test hooks, `metal::` runs clean at 8 threads (30/30 runs).
#
# Serial stays the default because the full lib suite at 8 threads still hits
# fail-closed memory admission (heavy session tests allocating at once), rare
# GPU lockups whose triggering kernel is unidentified, and timing tests that
# assume an idle GPU. Run parallel deliberately: `-- --test-threads=N`.
[env]
RUST_TEST_THREADS = "1"
