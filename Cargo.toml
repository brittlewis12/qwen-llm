[workspace]
resolver = "2"
members = ["crates/qwen-llm", "crates/qwen-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Britt Lewis"]

[workspace.dependencies]
# host-side metal bindings (objc2-metal is the active successor to metal-rs)
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSData"] }
objc2-metal = { version = "0.3", features = [
    "MTLAllocation",
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLComputePass",
    "MTLComputeCommandEncoder",
    "MTLFence",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLLibrary",
    "MTLComputePipeline",
    "MTLBinaryArchive",
    "MTLCounters",
    "MTLResource",
    "MTLResidencySet",
    "MTLTypes",
    "MTLArgumentEncoder",
    "block2",
] }
block2 = "0.6"

# loader / codec
memmap2 = "0.9"
byteorder = "1.5"
half = { version = "2.6", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
gguf-rs = { path = "../gguf" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
blake3 = { version = "1", features = ["rayon"] }
unicode-general-category = "=1.1.0"
rustc-hash = "2"

# dequant codec for tooling / re-pack-on-load (see docs/PLAN.md weight-format role table)
llama-cpp-sys-2 = { path = "../llama-cpp-rs/llama-cpp-sys-2" }

# error / logging
thiserror = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# cli
clap = { version = "4.5", features = ["derive"] }

# parallel prep + worker threads for cpu↔gpu pipelining
crossbeam = "0.8"
parking_lot = "0.12"
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = "line-tables-only"

[profile.bench]
inherits = "release"
debug = "full"

# Criterion for proper statistical benchmarking. cargo bench replaces our
# #[ignore] perf tests; hyperfine handles the end-to-end wall-clock
# comparisons against llama-bench.
[workspace.dependencies.criterion]
version = "0.5"
features = ["html_reports"]

# Workspace-wide clippy config. Per-crate `[lints] workspace = true` opts in.
[workspace.lints.clippy]
# `too_many_arguments`: kernel encode functions in metal.rs and
# metal_forward.rs deliberately take many args (Metal kernel signatures
# are FFI-shaped: ctx + encoder + N tensor args + N shape args). Default
# threshold of 7 fires constantly for ~25 of these and refactoring into
# a struct hurts readability of every call site without buying anything.
too_many_arguments = "allow"
# Doc bullet lists in this crate use intentional column-aligned indent for
# readable visual tables (see lib.rs, loader.rs prelude). Clippy wants
# strict 2-space indent which would break those tables. The cost of the
# `allow` is bounded — documentation indentation, not code logic.
doc_overindented_list_items = "allow"
# `needless_range_loop`: kept at default `warn`. We audited every site
# (May 2026): 2 sites convert cleanly to iterator form (fixed in-place);
# the remaining 12 sites are CPU oracle / reference math where the loop
# index is multi-purpose (stride math `[s_off + dv * head_dim + dk]`,
# co-indexed multi-array dispatch `kv_cache.k(layer, p, head)`,
# branching/logging on the index) and the iter-rewrite obscures the
# math. Those 12 carry `#[allow(clippy::needless_range_loop)]` on the
# enclosing function or scope with a one-line justification each. This
# preserves the lint's value as a tripwire for genuinely-needless cases
# while accepting the few legitimate exceptions explicitly.
