[package]
publish = false
name = "qwen-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "qwen"
path = "src/main.rs"

[[bin]]
name = "qwen-bench"
path = "src/bench.rs"

[[bin]]
name = "qwen-tok"
path = "src/tok.rs"

[[bin]]
name = "qwen-census"
path = "src/census.rs"

[[bin]]
name = "qwen-grammar-oracle"
path = "src/grammar_oracle.rs"

[[bin]]
name = "qwen-lens"
path = "src/lens.rs"

[lints]
workspace = true

[features]
default = []
dflash-k0s-diagnostics = ["qwen-llm/dflash-k0s-diagnostics"]
dsv4-diagnostics = ["qwen-llm/dsv4-diagnostics"]

[dependencies]
qwen-llm = { path = "../qwen-llm" }
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true

anyhow.workspace = true
blake3.workspace = true
bytemuck.workspace = true
clap.workspace = true
half.workspace = true
libc.workspace = true
memmap2.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true

[build-dependencies]
sha2.workspace = true
