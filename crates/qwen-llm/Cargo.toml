[package]
publish = false
name = "qwen-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
half-staging-telemetry = []
dflash-k0s-diagnostics = []
dsv4-diagnostics = []
perf-ablations = []

[dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-metal-performance-shaders.workspace = true
rayon.workspace = true
block2.workspace = true

memmap2.workspace = true
byteorder.workspace = true
half.workspace = true
bytemuck.workspace = true
gguf-rs.workspace = true
serde_json.workspace = true
serde.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true
rustc-hash.workspace = true
sha2.workspace = true
blake3.workspace = true
libc.workspace = true
mach2.workspace = true

llama-cpp-sys-2.workspace = true

thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

crossbeam.workspace = true
parking_lot.workspace = true

[dev-dependencies]
criterion.workspace = true
fancy-regex = "0.14"
proptest = "1"
# Examples install a stock `tracing_subscriber::fmt` subscriber so the
# `qwen_diag` events emitted by the load path (previously bare
# `eprintln!` lines) remain visible when running via `cargo run --example`.
tracing-subscriber.workspace = true

[build-dependencies]
anyhow.workspace = true
sha2.workspace = true

[[example]]
name = "dispatch_deadtime"
required-features = ["perf-ablations"]

[[example]]
name = "fn_solo_bounds"
