# One representative per model family: the daily-driver artifact of each,
# for the cross-family qwen-llm vs llama.cpp baseline. `scripts/bench/models.toml`
# remains the Qwen size ladder.
#
# `lcpp = false`: upstream llama.cpp has no implementation of the
# architecture, so the cell is reported rather than measured.
# `tg_depths`: context depths for tg rows (llama-bench -d); long-context
# depths go to the models used for long sessions.

[[models]]
tag = "qwen38-27b"
display = "Qwen3.8-27B"
family = "qwen"
kind = "dense"
quant = "Q4_K_M"
path = "~/models/Qwen3.8-27B-Q4_K_M.gguf"
tg_depths = [0, 8192, 32768]

